name: Notch
options:
  bundleIdPrefix: com.guillaumeprost
  developmentLanguage: fr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  # « À l'écoute » de macOS (YouTube dans le navigateur, Deezer…) : voir Vendor/MediaRemoteAdapter.
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/MediaRemoteAdapter/src
      - path: Vendor/MediaRemoteAdapter/include
        headerVisibility: public
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapter
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumeprost.notch.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        # Les fonctions doivent rester visibles : le script Perl les appelle par leur nom.
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        OTHER_CFLAGS: ["-fvisibility=default"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/MediaRemoteAdapter/src", "$(SRCROOT)/Vendor/MediaRemoteAdapter/include"]
        CLANG_WARN_STRICT_PROTOTYPES: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Notch Local Signing"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
  Notch:
    type: application
    platform: macOS
    sources:
      - Notch
      - path: Vendor/MediaRemoteAdapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      # Intégré à l'app sans y être lié : seul le script Perl le charge.
      - target: MediaRemoteAdapter
        embed: true
        link: false
    info:
      path: Notch/Info.plist
      properties:
        CFBundleDisplayName: Encoche
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleDevelopmentRegion: fr
        NSCalendarsFullAccessUsageDescription: "Encoche affiche les événements de tes calendriers dans l'encoche."
        NSRemindersFullAccessUsageDescription: "Encoche affiche tes rappels du jour dans l'encoche et te permet de les cocher."
        NSBluetoothAlwaysUsageDescription: "Encoche affiche la connexion de tes appareils Bluetooth (AirPods, casque…) et leur batterie."
        NSAppleEventsUsageDescription: "Encoche pilote Musique et Spotify pour afficher et contrôler le morceau en cours."
    settings:
      base:
        # Nom affiché « Encoche ». L'identifiant reste « notch » : macOS y rattache les
        # autorisations déjà données (disque, accessibilité, calendrier…).
        PRODUCT_NAME: Encoche
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumeprost.notch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Certificat auto-signé local (Trousseau de session) : une identité stable pour que
        # macOS garde les autorisations (disque, calendrier, automatisation) entre deux builds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Notch Local Signing"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets: [NotchTests]
  # Tests unitaires de la logique (sans interface) : ./scripts/test.sh
  NotchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NotchTests]
    dependencies:
      - target: Notch
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Encoche.app/Contents/MacOS/Encoche"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumeprost.notch.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Notch Local Signing"
        DEVELOPMENT_TEAM: ""
