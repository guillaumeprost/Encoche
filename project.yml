name: Notch
options:
  bundleIdPrefix: com.guillaumeprost
  developmentLanguage: fr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Notch:
    type: application
    platform: macOS
    sources: [Notch]
    info:
      path: Notch/Info.plist
      properties:
        CFBundleDisplayName: Notch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleDevelopmentRegion: fr
        NSCalendarsFullAccessUsageDescription: "Notch affiche les événements de tes calendriers dans l'encoche."
        NSAppleEventsUsageDescription: "Notch pilote Musique et Spotify pour afficher et contrôler le morceau en cours."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumeprost.notch
        # Certificat auto-signé local (Trousseau de session) : une identité stable pour que
        # macOS garde les autorisations (disque, calendrier, automatisation) entre deux builds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Notch Local Signing"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
